name: Binor Agent
version: 0.1.28
slug: binor_agent
description: Supervision SAV et intelligence énergétique Binor pour Home Assistant.
url: https://binor.io
image: ghcr.io/binor-tech/home-assistant-{arch}-binor-agent
startup: application
boot: auto
init: false
arch: [aarch64, amd64]
homeassistant: 2026.8.0
homeassistant_api: true
services: [mqtt:need]
ingress: true
ingress_port: 8099
panel_icon: mdi:home-analytics
panel_title: Binor
options:
  api_url: https://api.binor.io
  mqtt_url: mqtts://mqtt.binor.io:8883
  pairing_code: ""
schema:
  api_url: url
  mqtt_url: url
  pairing_code: str?
environment:
  BINOR_AGENT_DATA_DIRECTORY: /data
  BINOR_AGENT_PORT: "8099"
