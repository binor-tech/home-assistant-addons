name: Binor Commissioning
slug: binor_commissioning
version: 0.6.4
image: ghcr.io/binor-tech/home-assistant-{arch}-binor-commissioning
description: Préparation atelier et mise en service temporaire des installations Binor.
url: https://binor.io
startup: application
boot: manual
init: false
arch:
  - aarch64
homeassistant: 2026.8.0
homeassistant_api: true
hassio_api: true
hassio_role: manager
services:
  - mqtt:need
map:
  - config:rw
ingress: true
ingress_port: 8098
panel_icon: mdi:progress-wrench
panel_title: Mise en service Binor
options:
  api_url: https://api.binor.io
  zigbee2mqtt_slug: 45df7312_zigbee2mqtt
  trusted_proxy_cidr: 172.30.33.0/24
schema:
  api_url: url
  zigbee2mqtt_slug: str
  trusted_proxy_cidr: str
environment:
  BINOR_COMMISSIONING_DATA_DIRECTORY: /data
  BINOR_HA_CONFIG_DIRECTORY: /config
  BINOR_COMMISSIONING_PORT: "8098"
